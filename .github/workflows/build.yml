name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Install ML package
        run: python -m pip install -e ml
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement ml/requirements-audit.txt
      # Lint only. `ruff format` is deliberately not run: the package is written in a
      # compact style that the formatter would undo, and that is a change to make
      # intentionally rather than as a side effect of adding a CI step.
      - name: Lint Python
        run: |
          python -m pip install ruff
          python -m ruff check ml
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DTUBEFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build VST3, standalone, and tests
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: |
          New-Item -ItemType Directory -Force build/test-results | Out-Null
          ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure --output-junit build/test-results/ctest-${{ matrix.configuration }}.xml
      - name: Capture Release benchmark reports
        if: matrix.configuration == 'Release'
        run: |
          & build/nts_dsp_benchmarks_artefacts/Release/nts_dsp_benchmarks.exe 2>&1 | Tee-Object build/test-results/dsp-benchmarks.txt
          & build/Release/nts_ml_runtime_benchmarks.exe 2>&1 | Tee-Object build/test-results/ml-runtime-benchmarks.txt
      - name: Stage reproducible release bundle
        if: matrix.configuration == 'Release'
        run: cmake --build build --config Release --target nts_release_bundle --parallel
      - name: Install Inno Setup
        if: matrix.configuration == 'Release'
        run: choco install innosetup --no-progress -y
      - name: Build unsigned CI installer
        if: matrix.configuration == 'Release'
        run: ./packaging/windows/build-installer.ps1 -BuildDirectory build -Configuration Release
      - name: Configure ASIO compile validation
        if: matrix.configuration == 'Release'
        run: cmake -S . -B build-asio -G "Visual Studio 17 2022" -A x64 -DTUBEFORGE_ENABLE_ASIO=ON -DFETCHCONTENT_SOURCE_DIR_JUCE="${{ github.workspace }}/build/_deps/juce-src"
      - name: Compile ASIO-enabled standalone and probe (not packaged)
        if: matrix.configuration == 'Release'
        run: cmake --build build-asio --config Release --target nts_standalone nts_asio_tests --parallel
      - name: Test ASIO registration
        if: matrix.configuration == 'Release'
        run: ctest --test-dir build-asio -C Release -R nts_asio_tests --output-on-failure
      - name: Upload test report
        uses: actions/upload-artifact@v7
        with:
          name: TubeForge-${{ matrix.configuration }}-Test-Report
          path: build/test-results
      - name: Upload Debug binaries
        if: matrix.configuration == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: TubeForge-Windows-Debug
          path: |
            build/TubeForge_artefacts/Debug/VST3/TubeForge.vst3
            build/nts_standalone_app_artefacts/Debug/TubeForge.exe
            build/**/*.pdb
      - name: Upload staged Release and symbols
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: TubeForge-Windows-Release-Bundle
          path: build/release/TubeForge-0.10.0-Windows-x64
      - name: Upload unsigned CI installer
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: TubeForge-Windows-Unsigned-CI-Installer
          path: build/release/installer/TubeForge-0.10.0-Windows-x64.exe

  # Advisory for now: reports findings without failing the build, so the initial backlog can be
  # worked down deliberately. Promote to blocking once it is clear. Needs a compile database,
  # which the Visual Studio generator does not emit, hence the separate Ninja configure.
  windows-clang-tidy:
    runs-on: windows-2022
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generate compile database
        run: >
          cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTUBEFORGE_BUILD_TESTS=OFF
      - name: Analyse engine sources
        shell: pwsh
        run: |
          $files = Get-ChildItem engine -Recurse -Filter *.cpp | ForEach-Object { $_.FullName }
          clang-tidy -p build-tidy --quiet $files

  # Address Sanitizer over the fast suites. Release only: MSVC's ASan cannot be combined with
  # the /RTC checks Debug enables. The soak and VST3 host tests are excluded because their
  # runtimes are impractical under the instrumentation slowdown.
  windows-sanitizers:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure with Address Sanitizer
        run: cmake -S . -B build-asan -G "Visual Studio 17 2022" -A x64 -DTUBEFORGE_ENABLE_SANITIZERS=ON
      - name: Build sanitized suites
        run: >
          cmake --build build-asan --config Release --parallel
          --target nts_unit_tests nts_dsp_tests nts_amp_tests nts_circuit_tests
          nts_ml_runtime_tests nts_tone_analysis_tests nts_reconstruction_tests
          nts_assistant_tests nts_ecosystem_tests
      - name: Run sanitized suites
        run: >
          ctest --test-dir build-asan -C Release --output-on-failure
          -R "nts_unit_tests|nts_dsp_tests|nts_amp_tests|nts_circuit_tests|nts_ml_runtime_tests|nts_tone_analysis_tests|nts_reconstruction_tests|nts_assistant_tests|nts_ecosystem_tests"

  windows-hour-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Configure soak test
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DTUBEFORGE_ENABLE_HOUR_SOAK_TEST=ON
      - name: Build soak test
        run: cmake --build build --config Release --target nts_soak_tests --parallel
      - name: Run one-hour wall-clock soak
        run: ctest --test-dir build -C Release -L soak --output-on-failure
